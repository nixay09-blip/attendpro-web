<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EIMI - Campus Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face { font-family: 'Blanka'; src: url('blanka.otf') format('opentype'); }
        ::-webkit-scrollbar { display: none; }
        
        * { 
            scrollbar-width: none; margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Space Grotesk', sans-serif;
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
        }
        
        input, .msg, .toast { user-select: auto; }
        *:focus-visible { outline: 1px solid #86efac; outline-offset: 2px; }

        body { 
            background: #060608;
            background-image: 
                radial-gradient(ellipse 60% 40% at 50% -10%, rgba(134, 239, 172, 0.12), transparent),
                radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px;
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            padding: clamp(12px, 2.5vw, 24px); 
            min-height: 100vh;
        }

        .container { 
            width: 100%; 
            max-width: 540px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px;
            animation: appFadeIn 0.4s ease-out;
        }

        @keyframes appFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        @keyframes radarPulse {
            0% { box-shadow: 0 0 0 0 rgba(253, 224, 71, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(253, 224, 71, 0); }
            100% { box-shadow: 0 0 0 0 rgba(253, 224, 71, 0); }
        }

        @keyframes badgeBreathingGlow {
            0%, 100% { 
                box-shadow: 0 0 15px rgba(134, 239, 172, 0.08), inset 0 0 0 1px rgba(134, 239, 172, 0.25); 
            }
            50% { 
                box-shadow: 0 0 30px rgba(134, 239, 172, 0.25), inset 0 0 0 1px rgba(134, 239, 172, 0.6); 
            }
        }

        @keyframes beaconPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 6px #86efac); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        @keyframes revealGlow {
            0%, 100% {
                box-shadow: 0 0 16px rgba(253, 224, 71, 0.35), inset 0 0 12px rgba(253, 224, 71, 0.2);
                border-color: rgba(253, 224, 71, 0.8);
            }
            50% {
                box-shadow: 0 0 28px rgba(253, 224, 71, 0.65), inset 0 0 18px rgba(253, 224, 71, 0.4);
                border-color: #fde047;
            }
        }

        @keyframes eyeScan {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        .svg-icon {
            width: 14px;
            height: 14px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* HEADER */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 12px; 
            padding-bottom: 6px;
        }
        .logo-container { 
            display: flex; 
            align-items: center; 
            gap: 10px;
            min-width: 130px;
        }
        .logo-img { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); object-fit: cover; }
        .title-area h1 { font-family: 'Blanka', sans-serif; font-size: 28px; letter-spacing: 2px; line-height: 1; margin: 0; }
        .title-area p { 
            font-size: 11px; 
            color: #86efac; 
            margin-top: 4px; 
            font-weight: 500; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            letter-spacing: 0.5px;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #86efac;
            box-shadow: 0 0 8px #86efac;
            animation: pulseDot 1.8s infinite ease-in-out;
        }
        
        .header-actions { 
            display: flex; 
            gap: 6px; 
            flex-wrap: wrap;
        }
        .btn { 
            background: rgba(18, 18, 22, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            color: #fff; 
            padding: 7px 11px; 
            border-radius: 9px; 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            white-space: nowrap;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn:hover { 
            background: #1e1e24; 
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        .btn:active { transform: scale(0.97); }
        
        .btn-match { 
            border-color: #fde047; 
            color: #fde047; 
            background: rgba(253, 224, 71, 0.06); 
            animation: radarPulse 2s infinite cubic-bezier(0.25, 0, 0, 1); 
        }
        .btn-match:hover { 
            background: #fde047; 
            color: #000; 
            box-shadow: 0 0 16px rgba(253, 224, 71, 0.5); 
            animation: none; 
        }

        .btn-logout {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.05);
        }
        .btn-logout:hover {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .btn-reveal-prime {
            position: relative;
            background: linear-gradient(135deg, #fde047 0%, #eab308 100%);
            color: #050505;
            border: 1px solid rgba(253, 224, 71, 0.9);
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            animation: revealGlow 2.2s infinite ease-in-out;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-reveal-prime:hover {
            transform: translateY(-2px) scale(1.02);
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 30px rgba(253, 224, 71, 0.85);
        }
        .reveal-eye-icon {
            width: 15px;
            height: 15px;
            stroke-width: 2.2;
            animation: eyeScan 2.4s infinite ease-in-out;
        }

        /* MAIN CONTENT LAYOUT */
        .desktop-content-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .desktop-sidebar {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .desktop-main {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            min-width: 0;
        }

        /* STATS CARDS */
        .stats-wrapper { 
            display: flex; 
            gap: 10px; 
            width: 100%;
            flex-wrap: wrap;
        }
        .overall-card { 
            background: rgba(16, 16, 20, 0.7); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06); 
            border-radius: 14px; 
            padding: 14px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex: 1 1 180px; 
            min-width: 140px;
            transition: all 0.25s ease;
        }
        .overall-card:hover {
            border-color: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .overall-info h3 { font-size: 10px; color: #71717a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-weight: 700; }
        .overall-info h2 { font-size: 15px; font-weight: 700; margin: 0; }
        .overall-ring { 
            font-size: 13px; 
            font-weight: 700; 
            border-radius: 50%; 
            width: 44px; 
            height: 44px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid; 
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        /* SEARCH & LIST */
        .search-box { 
            width: 100%; 
            padding: 11px 14px; 
            background: rgba(14, 14, 18, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.07); 
            border-radius: 11px; 
            color: #fff; 
            font-size: 13px; 
            outline: none; 
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box:focus { 
            border-color: #86efac; 
            box-shadow: 0 0 0 2px rgba(134, 239, 172, 0.12);
        }
        
        .section-title { 
            font-size: 11px; 
            font-weight: 700; 
            color: #71717a; 
            text-transform: uppercase; 
            letter-spacing: 1.2px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.06); }

        .subject-list { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            width: 100%;
        }
        .subject-card { 
            background: rgba(15, 15, 19, 0.7); 
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06); 
            border-radius: 14px; 
            padding: 14px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            transition: all 0.2s ease;
            min-width: 0;
        }
        .subject-card:hover {
            border-color: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }
        .card-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            gap: 12px;
        }
        .subject-info {
            min-width: 0;
            flex: 1;
        }
        .subject-info h4 { 
            font-size: 14px; 
            font-weight: 600; 
            margin-bottom: 2px; 
            word-break: break-word;
        }
        
        .status-tag { 
            font-size: 11px; 
            font-weight: 600; 
            margin-top: 4px; 
            display: inline-flex; 
            align-items: center; 
            gap: 5px; 
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
            flex-wrap: wrap;
        }
        .status-tag.safe { color: #86efac; border-color: rgba(134, 239, 172, 0.2); }
        .status-tag.risk { color: #fde047; border-color: rgba(253, 224, 71, 0.2); }

        .percentage { 
            font-weight: 700; 
            font-size: 20px; 
            text-align: right; 
            flex-shrink: 0;
        }

        .progress-bg { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.05); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }

        .quick-actions { 
            display: flex; 
            gap: 6px; 
            justify-content: flex-end; 
            padding-top: 4px; 
            flex-wrap: wrap;
        }
        .action-btn { 
            background: rgba(24, 24, 28, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            color: #a1a1aa; 
            padding: 5px 10px; 
            border-radius: 7px; 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            transition: all 0.15s ease;
        }
        .action-btn:hover { background: #27272a; color: #fff; }
        .action-btn:active { transform: scale(0.96); }

        /* CREATOR ATTENTION BADGE */
        .creator-badge-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 26px;
            margin-bottom: 12px;
            width: 100%;
        }
        .creator-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            border-radius: 999px;
            background: rgba(14, 14, 18, 0.95);
            border: 1px solid rgba(134, 239, 172, 0.35);
            animation: badgeBreathingGlow 3s infinite ease-in-out;
            transition: all 0.25s ease;
            text-decoration: none;
            cursor: pointer;
        }
        .creator-badge:hover {
            transform: translateY(-2px);
            border-color: #86efac;
            box-shadow: 0 0 35px rgba(134, 239, 172, 0.4);
            background: rgba(18, 22, 19, 0.95);
        }
        .creator-beacon {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #86efac;
            box-shadow: 0 0 10px #86efac;
            animation: beaconPulse 2s infinite ease-in-out;
            flex-shrink: 0;
        }
        .creator-label {
            font-size: 10px;
            color: #71717a;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .creator-name {
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }
        .creator-badge:hover .creator-name {
            color: #86efac;
            text-shadow: 0 0 10px rgba(134, 239, 172, 0.6);
        }

        /* MODALS */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.82); 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
            backdrop-filter: blur(6px);
            padding: 16px;
        }
        .modal-content { 
            background: #111116; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            border-radius: 16px; 
            padding: 20px; 
            width: 100%; 
            max-width: 360px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
        .modal-input { 
            padding: 11px 12px; 
            background: #09090c; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 9px; 
            color: #fff; 
            font-size: 13px; 
            outline: none; 
            width: 100%; 
            transition: border-color 0.2s;
        }
        .modal-input:focus { border-color: #86efac; }
        .modal-input::placeholder { color: #52525b; }
        .modal-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }

        /* FAST RENDERING CHAT BOX */
        .chat-box { 
            height: 240px; 
            background: #09090c; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 11px; 
            padding: 12px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            contain: content;
        }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        .msg-wrapper.me { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.stranger { align-self: flex-start; align-items: flex-start; }
        .msg { padding: 8px 12px; border-radius: 11px; font-size: 13px; line-height: 1.4; word-break: break-word; }
        .msg-wrapper.me .msg { background: #fff; color: #000; }
        .msg-wrapper.stranger .msg { background: #1c1c22; color: #fff; border: 1px solid rgba(255, 255, 255, 0.08); }
        .msg-time { font-size: 9px; color: #71717a; margin-top: 3px; }
        .timer-text { font-family: monospace; font-size: 16px; color: #fde047; font-weight: 700; }
        .chat-input-wrapper { display: flex; gap: 6px; }

        /* GAME */
        .game-container { 
            display: none; 
            text-align: center; 
            background: #09090c; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 12px; 
            padding: 10px; 
        }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .game-header-tag { font-size: 10px; color: #71717a; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .game-score-badge { font-family: monospace; font-size: 12px; font-weight: 700; color: #86efac; }
        #flappyCanvas { background: #000; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 9px; display: block; margin: 0 auto; cursor: pointer; max-width: 100%; }
        .game-footer-hint { font-size: 10px; color: #71717a; margin-top: 6px; }

        .toast { 
            position: fixed; 
            bottom: 24px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #fff; 
            color: #000; 
            padding: 10px 18px; 
            border-radius: 10px; 
            font-size: 12px; 
            font-weight: 600; 
            display: none; 
            z-index: 1000; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.error { background: #ef4444; color: #fff; }
        .toast.success { background: #86efac; color: #000; }

        /* FLUID DESKTOP VIEW */
        @media (min-width: 860px) {
            .container { 
                max-width: 880px; 
            }
            .desktop-content-grid { 
                display: grid; 
                grid-template-columns: 290px 1fr; 
                gap: 24px; 
                align-items: start; 
            }
            .desktop-sidebar { 
                position: sticky; 
                top: 20px; 
            }
            .stats-wrapper { 
                flex-direction: column; 
            }
            .overall-card {
                flex: none;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">Message here</div>

    <!-- MAIN APP CONTAINER -->
    <div class="container" id="mainApp">
        <!-- HEADER -->
        <div class="header">
            <div class="logo-container">
                <img src="logo.jpg" alt="Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="title-area">
                    <h1>EIMI</h1>
                    <p id="userGreeting">
                        <span class="live-dot"></span> Campus Hub
                    </p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-match" onclick="openIcebreaker()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg> Match
                </button>
                <button class="btn" onclick="openAddModal()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add
                </button>
                <button class="btn" onclick="openSyncModal()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg> Sync
                </button>
                <button class="btn btn-logout" id="logoutBtn" onclick="handleLogout()" title="Logout and clear local data">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> Exit
                </button>
            </div>
        </div>

        <!-- MAIN LAYOUT -->
        <div class="desktop-content-grid">
            <div class="desktop-sidebar">
                <div class="stats-wrapper">
                    <div class="overall-card">
                        <div class="overall-info"><h3>Theory</h3><h2 id="theoryStatusText">--</h2></div>
                        <div class="overall-ring" id="theoryRing">0%</div>
                    </div>
                    <div class="overall-card">
                        <div class="overall-info"><h3>Practical</h3><h2 id="pracStatusText">--</h2></div>
                        <div class="overall-ring" id="pracRing">0%</div>
                    </div>
                </div>
                <input type="text" class="search-box" id="searchInput" placeholder="Search modules... (Press '/')" onkeyup="filterSubjects()">
            </div>

            <div class="desktop-main">
                <div class="section-title">Your Attendance</div>
                <div class="subject-list" id="subjectList" style="margin-top: 10px;"></div>
            </div>
        </div>

        <!-- CREATOR BADGE -->
        <div class="creator-badge-wrapper">
            <div class="creator-badge">
                <span class="creator-beacon"></span>
                <span class="creator-label">BUILT BY</span>
                <span class="creator-name">NIXAY RAUT</span>
            </div>
        </div>
    </div>

    <!-- MODAL: CAMPUS PULSE -->
    <div class="modal" id="iceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color: #fde047;">Campus Pulse</h3>
                <div class="timer-text" id="chatTimer">05:00</div>
            </div>
            <div class="chat-box" id="chatBox"></div>
            <div class="chat-input-wrapper">
                <input type="text" class="modal-input" id="chatInput" placeholder="Type a message..." style="flex: 1;" onkeydown="handleChatEnter(event)" autocomplete="off">
                <button class="btn" onclick="sendMsg()" style="background: #fff; color: #000; padding: 0 14px;">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeIcebreaker()">Exit</button>
                <button class="btn-reveal-prime" id="revealBtn" style="display: none;" onclick="revealIdentity()">
                    <svg class="svg-icon reveal-eye-icon" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
                    </svg>
                    Reveal ID
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: CUSTOM NAME PROMPT -->
    <div class="modal" id="namePromptModal">
        <div class="modal-content">
            <div class="modal-header"><h3>Identify Yourself</h3></div>
            <p style="font-size: 12px; color: #71717a;">Bina sync ke chat? Apna naam type kar:</p>
            <input type="text" class="modal-input" id="customNameInput" placeholder="Your name..." autocomplete="off" onkeydown="handleNameEnter(event)">
            <div class="modal-footer">

    <!-- FIREBASE LIVE CHAT LOGIC (HIGH PERFORMANCE) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, push, onChildAdded, onValue, remove, onDisconnect, off } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwQ-BbV6rKhjrfRHg6okUskBhYGhypF4o",
            authDomain: "eimi-chat-49339.firebaseapp.com",
            databaseURL: "https://eimi-chat-49339-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "eimi-chat-49339",
            storageBucket: "eimi-chat-49339.firebasestorage.app",
            messagingSenderId: "1098210161751",
            appId: "1:1098210161751:web:c4d6a78631118391909f12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentRoom = null;
        let userId = "user_" + Math.random().toString(36).substr(2, 9);
        let timerInterval = null;
        let timeLeft = 300;
        let disconnectRef = null;
        let msgRefQuery = null;
        let matchListenerRef = null;
        let revealedCount = 0;
        let autoDisconnectTimeout = null;

        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        window.openIcebreaker = function() {
            cleanupActiveSession();
            revealedCount = 0;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '<p style="text-align:center; font-size:12px; color:#71717a; margin-top:30px;">Finding random student on radar...</p>';
            document.getElementById('revealBtn').style.display = 'none';
            document.getElementById('chatTimer').innerText = "05:00";
            document.getElementById('iceModal').style.display = 'flex';
            
            const waitingRef = ref(db, 'waiting');
            onValue(waitingRef, (snapshot) => {
                if (currentRoom) return; 
                const waitingUsers = snapshot.val();
                let foundPartner = false;
                
                if (waitingUsers) {
                    for (let partnerId in waitingUsers) {
                        if (partnerId !== userId) {
                            currentRoom = partnerId + "_" + userId;
                            remove(ref(db, 'waiting/' + partnerId)); 
                            set(ref(db, 'rooms/' + currentRoom + '/info'), { status: "active", users: [partnerId, userId] }); 
                            startChatRoom(currentRoom);
                            foundPartner = true;
                            break;
                        }
                    }
                }
                
                if (!foundPartner) {
                    set(ref(db, 'waiting/' + userId), { timestamp: Date.now() });
                    onDisconnect(ref(db, 'waiting/' + userId)).remove();
                    
                    matchListenerRef = ref(db, 'rooms');
                    onValue(matchListenerRef, (roomSnap) => {
                        if (currentRoom) return;
                        roomSnap.forEach(room => {
                            if (room.key.includes(userId) && !currentRoom) {
                                currentRoom = room.key;
                                if(matchListenerRef) { off(matchListenerRef); matchListenerRef = null; }
                                startChatRoom(currentRoom);
                            }
                        });
                    });
                }
            }, { onlyOnce: true });
        };

        function startChatRoom(roomId) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '<p style="text-align:center; font-size:12px; color:#86efac; margin-top:10px; font-weight:600;">Connected! Say hi.</p>';
            setTimeout(() => { document.getElementById('chatInput').focus(); }, 150);
            
            onDisconnect(ref(db, 'rooms/' + roomId)).remove();

            disconnectRef = ref(db, 'rooms/' + roomId);
            onValue(disconnectRef, (snapshot) => {
                if (!snapshot.exists() && currentRoom === roomId) {
                    addSysMsg("Partner disconnected.");
                    if(timerInterval) clearInterval(timerInterval);
                    if(msgRefQuery) off(msgRefQuery);
                    currentRoom = null;
                }
            });
            
            msgRefQuery = ref(db, 'rooms/' + roomId + '/messages');
            onChildAdded(msgRefQuery, (data) => {
                const msg = data.val();
                const isMe = msg.sender === userId;
                const msgClass = isMe ? "me" : "stranger";
                const safeText = escapeHTML(msg.text || "");
                const safeTime = escapeHTML(msg.time || "");
                
                const html = `
                    <div class="msg-wrapper ${msgClass}">
                        <div class="msg">${safeText}</div>
                        <div class="msg-time">${safeTime}</div>
                    </div>`;
                
                // Zero-lag fast insertion
                chatBox.insertAdjacentHTML('beforeend', html);
                chatBox.scrollTop = chatBox.scrollHeight; 

                if (msg.text && msg.text.includes("Identity Revealed:")) {
                    revealedCount++;
                    if (revealedCount >= 2) {
                        addSysMsg("Both identities revealed! Closing chat in 10s... 🚀");
                        autoDisconnectTimeout = setTimeout(() => {
                            closeIcebreaker();
                            showToast("Chat completed & room closed!");
                        }, 10000);
                    }
                }
            });

            timeLeft = 300;
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                let s = (timeLeft % 60).toString().padStart(2, '0');
                document.getElementById('chatTimer').innerText = `${m}:${s}`;
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('revealBtn').style.display = 'inline-flex';
                    addSysMsg("Time up. You can now reveal ID.");
                }
            }, 1000);
        }

        window.sendMsg = function() {
            const input = document.getElementById('chatInput');
            const txt = input.value.trim();
            if(txt === '' || !currentRoom) return;
            
            input.value = ''; 
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

            push(ref(db, 'rooms/' + currentRoom + '/messages'), { 
                sender: userId, 
                text: txt,
                time: timeString
            });
            input.focus();
        };

        window.handleChatEnter = function(e) { 
            if(e.key === 'Enter') {
                e.preventDefault(); 
                sendMsg(); 
            }
        };

        function cleanupActiveSession() {
            if(timerInterval) clearInterval(timerInterval);
            if(autoDisconnectTimeout) clearTimeout(autoDisconnectTimeout);
            if(disconnectRef) off(disconnectRef);
            if(msgRefQuery) off(msgRefQuery);
            if(matchListenerRef) off(matchListenerRef);
            disconnectRef = null;
            msgRefQuery = null;
            matchListenerRef = null;
        }

        window.closeIcebreaker = function() {
            document.getElementById('iceModal').style.display = 'none';
            cleanupActiveSession();
            
            if (currentRoom) {
                remove(ref(db, 'rooms/' + currentRoom)); 
                currentRoom = null;
            } else {
                remove(ref(db, 'waiting/' + userId));
            }
        };

        window.addSysMsg = function(text) {
            const chatBox = document.getElementById('chatBox');
            const sysHtml = `<p style="text-align:center; font-size:11px; color:#fde047; margin: 8px 0; background: rgba(253, 224, 71, 0.08); padding: 5px; border-radius: 6px;">${escapeHTML(text)}</p>`;
            chatBox.insertAdjacentHTML('beforeend', sysHtml);
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        window.revealIdentity = function() {
            let savedId = localStorage.getItem('eimi_college_id');
            let actualName = "";

            if (savedId && savedId.trim() !== "") {
                let extracted = savedId.replace(/[^a-zA-Z]/g, ''); 
                actualName = extracted ? (extracted.charAt(0).toUpperCase() + extracted.slice(1).toLowerCase()) : savedId;
                executeReveal(actualName);
            } else {
                document.getElementById('namePromptModal').style.display = 'flex';
                setTimeout(() => document.getElementById('customNameInput').focus(), 100);
            }
        };

        window.closeNamePromptModal = function() {
            document.getElementById('namePromptModal').style.display = 'none';
        };

        window.submitCustomName = function() {
            const input = document.getElementById('customNameInput');
            let val = input.value.trim();
            if(!val) return;
            closeNamePromptModal();
            input.value = '';
            executeReveal(val);
        };

        window.handleNameEnter = function(e) {
            if(e.key === 'Enter') {
                e.preventDefault(); 
                submitCustomName();
            }
        };

        function executeReveal(name) {
            document.getElementById('revealBtn').style.display = 'none';
            if(currentRoom) {
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
                push(ref(db, 'rooms/' + currentRoom + '/messages'), { 
                    sender: userId, 
                    text: `Identity Revealed: [ ${name} ]`,
                    time: timeString
                });
            }
        }
    </script>

    <!-- CORE LOGIC & FLAPPY DOT -->
    <script>
        let currentSubjects = [];
        const API_URL = "https://attendpro-web-2.onrender.com/sync";

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2800);
        }

        function updateGreeting() {
            let savedId = localStorage.getItem('eimi_college_id');
            if (savedId && savedId.trim() !== "") {
                let extracted = savedId.replace(/[^a-zA-Z]/g, '');

                document.getElementById('logoutBtn').style.display = 'none';
            }
        }

        /* DATA WIPE LOGOUT LOGIC */
        function handleLogout() {
            localStorage.removeItem('eimi_college_id');
            localStorage.removeItem('user_attendance');
            currentSubjects = [];

            document.getElementById('collegeId').value = '';
            document.getElementById('collegePass').value = '';
            document.getElementById('searchInput').value = '';

            updateOverallStats([]);
            renderSubjects([]);
            updateGreeting();

            showToast("Logged out & local data wiped!", "error");
        }

        /* FLAPPY DOT LOGIC */
        let canvas, ctx, dotY, dotVelocity, pipes = [], score = 0, flappyLoopId = null, isGameOver = false, isStarted = false;

        function initFlappyDot() {
            canvas = document.getElementById('flappyCanvas');
            if(!canvas) return;
            ctx = canvas.getContext('2d');
            dotY = canvas.height / 2;
            dotVelocity = 0;
            pipes = [];
            score = 0;
            isGameOver = false;
            isStarted = false;
            document.getElementById('flappyScore').innerText = "00";

            canvas.onpointerdown = (e) => { e.preventDefault(); flapJump(); };
            if(flappyLoopId) cancelAnimationFrame(flappyLoopId);
            renderWaiting();
        }

        function renderWaiting() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.arc(50, canvas.height / 2, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#86efac';
            ctx.fill();
            ctx.fillStyle = '#71717a';
            ctx.font = '600 11px "Space Grotesk"';
            ctx.textAlign = 'center';
            ctx.fillText('CLICK TO PLAY', canvas.width / 2, canvas.height / 2 + 4);
        }

        function flapJump() {
            if(isGameOver) { initFlappyDot(); return; }
            if(!isStarted) { isStarted = true; dotVelocity = -3.8; runLoop(); return; }
            dotVelocity = -3.8;
        }

        function runLoop() {
            if(!isStarted || isGameOver) return;
            dotVelocity += 0.18;
            if(dotVelocity > 4) dotVelocity = 4;
            dotY += dotVelocity;

            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 120) {
                let gap = 70;
                let topH = Math.floor(Math.random() * (canvas.height - gap - 30)) + 15;
                pipes.push({ x: canvas.width, top: topH, bottom: canvas.height - (topH + gap), passed: false });
            }

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];
                p.x -= 1.1;
                ctx.fillStyle = '#1c1c22';
                ctx.fillRect(p.x, 0, 14, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, 14, p.bottom);

                if (55 > p.x && 45 < p.x + 14) {
                    if (dotY - 5 < p.top || dotY + 5 > canvas.height - p.bottom) isGameOver = true;
                }
                if (!p.passed && p.x + 14 < 45) {
                    p.passed = true;
                    score++;
                    document.getElementById('flappyScore').innerText = score < 10 ? `0${score}` : score;
                }
            }

            pipes = pipes.filter(p => p.x > -20);
            if (dotY + 5 >= canvas.height || dotY - 5 <= 0) isGameOver = true;

            ctx.beginPath();
            ctx.arc(50, dotY, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#86efac';
            ctx.fill();

            if (!isGameOver) {
                flappyLoopId = requestAnimationFrame(runLoop);
            } else {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fde047';
                ctx.font = '700 12px "Space Grotesk"';
                ctx.textAlign = 'center';
                ctx.fillText('CRASHED', canvas.width / 2, canvas.height / 2 - 4);
                ctx.fillStyle = '#71717a';
                ctx.font = '500 10px "Space Grotesk"';
                ctx.fillText('Click to retry', canvas.width / 2, canvas.height / 2 + 12);
            }
        }

        /* KEYBOARD SHORTCUTS */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { 
                document.activeElement.blur(); 
                closeAddModal(); closeSyncModal(); closeNamePromptModal();
                if(typeof closeIcebreaker === 'function') closeIcebreaker(); 
                return; 
            }
            if (e.code === 'Space' && document.getElementById('gameContainer').style.display === 'block') {
                e.preventDefault();
                flapJump();
                return;
            }
            if (e.key === 'Enter') {
                if (document.getElementById('syncModal').style.display === 'flex' && document.getElementById('authForm').style.display !== 'none') { runLiveSync(); return; }
                if (document.getElementById('addModal').style.display === 'flex') { saveNewSubject(); return; }
                if (document.getElementById('namePromptModal').style.display === 'flex') { submitCustomName(); return; }
            }
            if (document.activeElement.tagName !== 'INPUT') {
                if (e.key.toLowerCase() === 's') { e.preventDefault(); openSyncModal(); setTimeout(() => document.getElementById('collegeId').focus(), 100); }
                if (e.key.toLowerCase() === 'a') { e.preventDefault(); openAddModal(); setTimeout(() => document.getElementById('newSubName').focus(), 100); }
                if (e.key.toLowerCase() === 'm') { e.preventDefault(); if(typeof openIcebreaker === 'function') openIcebreaker(); }
                if (e.key === '/') { e.preventDefault(); document.getElementById('searchInput').focus(); }
            }
        });

        /* ATTENDANCE CALCULATIONS */
        function calculateStatus(present, total) {
            if (total === 0) return { pct: 0, status: "Pending", isRisk: false };
            const pct = Math.round((present / total) * 100);
            if (pct >= 75) { 
                const safeBunks = Math.floor((present - (0.75 * total)) / 0.75); 
                return { pct, status: `Safe [${safeBunks} bunks left]`, isRisk: false }; 
            } else { 
                const needed = Math.ceil(((0.75 * total) - present) / 0.25); 
                return { pct, status: `Warning [Need ${needed} classes]`, isRisk: true }; 
            }
        }
        
        function updateOverallStats(data) {
            const setRing = (id, pct, isSafe) => {
                const ring = document.getElementById(id + 'Ring'); 
                const text = document.getElementById(id + 'StatusText');
                ring.innerText = pct + '%'; 
                text.innerText = isSafe ? 'Secure' : 'At Risk';
                const color = isSafe ? '#86efac' : '#fde047';
                ring.style.color = color; 
                ring.style.borderColor = color; 
                text.style.color = color;
            };

            if (!data || data.length === 0) {
                setRing('theory', 0, true);
                setRing('prac', 0, true);
                document.getElementById('theoryStatusText').innerText = '--';
                document.getElementById('pracStatusText').innerText = '--';
                return;
            }

            let tPresent = 0, tTotal = 0, tRisk = 0, pPresent = 0, pTotal = 0, pRisk = 0;
            data.forEach(sub => { 
                if (sub.name.includes("(Practical)")) { 
                    pPresent += sub.present; pTotal += sub.total; if (sub.pct < 75) pRisk++; 
                } else { 
                    tPresent += sub.present; tTotal += sub.total; if (sub.pct < 75) tRisk++; 
                } 
            });

            const tPct = tTotal === 0 ? 0 : Math.round((tPresent / tTotal) * 100);
            setRing('theory', tPct, tPct >= 75 && tRisk === 0);
            const pPct = pTotal === 0 ? 0 : Math.round((pPresent / pTotal) * 100);
            setRing('prac', pPct, pPct >= 75 && pRisk === 0);
        }

        function renderSubjects(data) {
            const list = document.getElementById('subjectList'); 
            list.innerHTML = '';
            if (!data || data.length === 0) { 
                list.innerHTML = `
                    <div style="text-align:center; padding:30px; background:rgba(18, 18, 22, 0.6); border-radius:12px; border:1px dashed rgba(255,255,255,0.08);">
                        <p style="color:#71717a; font-size:12px; margin-bottom:10px;">No modules loaded.</p>
                        <button class="btn" style="margin:0 auto;" onclick="openSyncModal()">Sync Portal</button>
                    </div>`; 
                return; 
            }
            
            data.forEach((sub, index) => {
                const isRisk = sub.pct < 75; 
                const fillWidth = sub.pct > 100 ? 100 : sub.pct;
                const barColor = isRisk ? '#fde047' : '#86efac';
                const statusClass = isRisk ? 'risk' : 'safe';

                list.innerHTML += `
                    <div class="subject-card">
                        <div class="card-top">
                            <div class="subject-info">
                                <h4>${sub.name}</h4>
                                <div style="font-size:11px; color:#71717a; margin:2px 0;">${sub.present} / ${sub.total} Classes</div>
                                <div class="status-tag ${statusClass}">
                                    ${isRisk ? 
                                        '<svg class="svg-icon" viewBox="0 0 24 24" style="width:12px; height:12px;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>' : 
                                        '<svg class="svg-icon" viewBox="0 0 24 24" style="width:10px; height:10px; fill: currentColor; stroke: none;"><circle cx="12" cy="12" r="5"></circle></svg>'
                                    } 
                                    ${sub.status}
                                </div>
                            </div>
                            <div class="percentage" style="color: ${barColor}">${sub.pct}%</div>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: ${fillWidth}%; background: ${barColor};"></div>
                        </div>
                        <div class="quick-actions">
                            <button class="action-btn" onclick="quickMark(${index}, true)">+1 Present</button>
                            <button class="action-btn" onclick="quickMark(${index}, false)">+1 Bunk</button>
                        </div>
                    </div>`;
            });
        }
        
        function quickMark(index, isPresent) { 
            currentSubjects[index].total += 1; 
            if (isPresent) currentSubjects[index].present += 1; 
            const info = calculateStatus(currentSubjects[index].present, currentSubjects[index].total); 
            currentSubjects[index].pct = info.pct; 
            currentSubjects[index].status = info.status; 
            saveAndRefresh(); 
        }

        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; setTimeout(()=>document.getElementById('newSubName').focus(), 100); }
        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }
        function openSyncModal() { 
            document.getElementById('syncModal').style.display = 'flex'; 
            document.getElementById('authForm').style.display = 'flex'; 
            document.getElementById('gameContainer').style.display = 'none'; 
            setTimeout(()=>document.getElementById('collegeId').focus(), 100); 
        }
        function closeSyncModal() { 
            document.getElementById('syncModal').style.display = 'none'; 
            if(flappyLoopId) cancelAnimationFrame(flappyLoopId);
        }
        
        function saveNewSubject() { 
            const name = document.getElementById('newSubName').value; 
            const present = parseInt(document.getElementById('newSubPresent').value) || 0; 
            const total = parseInt(document.getElementById('newSubTotal').value) || 0; 
            if (!name || total <= 0) return showToast("Enter valid details", "error"); 
            const info = calculateStatus(present, total); 
            currentSubjects.push({ name, present, total, status: info.status, pct: info.pct }); 
            closeAddModal(); saveAndRefresh(); 
            showToast("Module added");
        }
        
        async function runLiveSync() {
            const user = document.getElementById('collegeId').value.trim(); 
            const pass = document.getElementById('collegePass').value.trim();
            if(!user || !pass) return showToast("Credentials required!", "error");
            
            document.getElementById('authForm').style.display = 'none'; 
            document.getElementById('gameContainer').style.display = 'block'; 
            initFlappyDot();
            
            try {
                const res = await fetch(`${API_URL}?user=${encodeURIComponent(user)}&passw=${encodeURIComponent(pass)}`); 
                const result = await res.json();
                if(result.success) {
                    localStorage.setItem('eimi_college_id', user);
                    updateGreeting(); 
                    let nameCount = {}; result.data.forEach(sub => { nameCount[sub.name] = (nameCount[sub.name] || 0) + 1; });
                    let currentNameCount = {};
                    currentSubjects = result.data.map(sub => {
                        let finalName = sub.name; 
                        if (nameCount[sub.name] > 1) { 
                            currentNameCount[sub.name] = (currentNameCount[sub.name] || 0) + 1; 
                            if (currentNameCount[sub.name] === 1) finalName += " (Theory)"; 
                            else if (currentNameCount[sub.name] === 2) finalName += " (Practical)"; 
                        }
                        const info = calculateStatus(sub.present, sub.total); 
                        return { ...sub, name: finalName, status: info.status };
                    });
                    saveAndRefresh(); 
                    closeSyncModal(); 
                    showToast("Attendance updated");
                } else { 
                    showToast("Sync failed: " + result.error, "error"); 
                    document.getElementById('authForm').style.display = 'flex'; 
                    document.getElementById('gameContainer').style.display = 'none'; 
                    if(flappyLoopId) cancelAnimationFrame(flappyLoopId);
                }
            } catch(e) { 
                showToast("Server error, retrying...", "error"); 
                document.getElementById('authForm').style.display = 'flex'; 
                document.getElementById('gameContainer').style.display = 'none'; 
                if(flappyLoopId) cancelAnimationFrame(flappyLoopId);
            }
        }
        
        function saveAndRefresh() { 
            localStorage.setItem('user_attendance', JSON.stringify(currentSubjects)); 
            updateOverallStats(currentSubjects); 
            renderSubjects(currentSubjects); 
        }

        function filterSubjects() { 
            const q = document.getElementById('searchInput').value.toLowerCase(); 
            renderSubjects(currentSubjects.filter(s => s.name.toLowerCase().includes(q))); 
        }
        
        document.addEventListener('DOMContentLoaded', () => { 
            updateGreeting(); 
            const saved = localStorage.getItem('user_attendance'); 
            if (saved) { 
                currentSubjects = JSON.parse(saved); 
                updateOverallStats(currentSubjects); 
                renderSubjects(currentSubjects); 
            } else { 
                renderSubjects([]); 
            } 
        });
    </script>
</body>
</html>
