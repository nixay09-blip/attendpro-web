<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIMI - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom Blanka Font Load for OTF */
        @font-face {
            font-family: 'Blanka';
            src: url('blanka.otf') format('opentype');
        }

        /* Scrollbar Hider Magic */
        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; -ms-overflow-style: none; margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        
        /* Focus Ring for Keyboard Navigation */
        *:focus-visible { outline: 2px solid #86efac; outline-offset: 3px; border-radius: 4px; }
        
        iframe { display: none !important; }
        
        body { background-color: #000000; color: #ffffff; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; }
        
        /* Header & Logo */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 42px; height: 42px; border-radius: 50%; border: 1px solid #333; object-fit: cover; display: block; }
        .header h1 { font-family: 'Blanka', sans-serif; font-size: 38px; letter-spacing: 4px; color: #ffffff; margin: 0; line-height: 1; margin-top: -8px; }
        
        .header-actions { display: flex; gap: 8px; }
        .btn { background: #000000; border: 1px solid #404040; color: #ffffff; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 13px; font-weight: 600; }
        .btn:hover { background: #ffffff; color: #000000; border-color: #ffffff; }
        
        .search-box { width: 100%; padding: 12px 16px; background: #0a0a0a; border: 1px solid #333333; border-radius: 10px; color: #ffffff; font-size: 14px; margin-bottom: 20px; outline: none; transition: 0.3s; }
        .search-box:focus { border-color: #ffffff; }
        
        .overall-card { background: #0a0a0a; border: 1px solid #333333; border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .overall-info h3 { font-size: 11px; color: #888888; text-transform: uppercase; letter-spacing: 1px; }
        .overall-info h2 { font-size: 15px; font-weight: 700; margin: 4px 0; }
        .overall-ring { font-size: 15px; font-weight: 700; padding: 10px; border-radius: 50%; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; border: 2px solid; }
        
        .section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #a3a3a3; text-transform: uppercase; letter-spacing: 1px; }
        .subject-list { display: flex; flex-direction: column; gap: 12px; max-height: 480px; overflow-y: auto; }
        
        .subject-card { background: #050505; border: 1px solid #262626; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: 0.3s; }
        .subject-card:hover { border-color: #525252; }
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .subject-info h4 { font-size: 14px; font-weight: 600; color: #ffffff; }
        
        .status-tag { font-size: 11px; font-weight: 600; margin-top: 4px; }
        .safe { color: #86efac; } .risk { color: #fde047; }
        .percentage { font-weight: 700; font-size: 18px; text-align: right; }
        
        .quick-actions { display: flex; gap: 8px; border-top: 1px solid #262626; padding-top: 10px; justify-content: flex-end; }
        .action-btn { background: transparent; border: 1px solid #404040; color: #a3a3a3; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { background: #262626; color: #ffffff; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal-content { background: #0a0a0a; border: 1px solid #404040; border-radius: 16px; padding: 24px; width: 90%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }
        .modal-content h3 { font-family: 'Blanka', sans-serif; color: #ffffff; letter-spacing: 2px; }
        
        .modal-input { padding: 12px; background: #000000; border: 1px solid #333333; border-radius: 8px; color: #ffffff; outline: none; }
        .modal-input:focus { border-color: #ffffff; }
        
        #authForm { display: flex; flex-direction: column; gap: 14px; width: 100%; }

        /* Tic-Tac-Toe Game CSS */
        .game-container { display: none; margin-top: 5px; text-align: center; }
        .game-status { font-size: 15px; font-weight: 700; color: #86efac; margin-bottom: 12px; font-family: 'Space Grotesk', sans-serif; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .cell { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; height: 75px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; cursor: pointer; color: #ffffff; transition: 0.2s; }
        .cell:hover { background: #262626; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="logo.jpg" alt="EIMI Logo" class="logo-img" onerror="this.style.display='none'">
                <h1>EIMI</h1>
            </div>
            <div class="header-actions">
                <button class="btn" onclick="openAddModal()">+ Add</button>
                <button class="btn" onclick="openSyncModal()">⟳ Sync</button>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 24px;">
            <div class="overall-card" style="margin-bottom: 0; flex: 1;">
                <div class="overall-info">
                    <h3>Theory</h3>
                    <h2 id="theoryStatusText">Loading...</h2>
                </div>
                <div class="overall-ring" id="theoryRing">0%</div>
            </div>
            <div class="overall-card" style="margin-bottom: 0; flex: 1;">
                <div class="overall-info">
                    <h3>Practical</h3>
                    <h2 id="pracStatusText">Loading...</h2>
                </div>
                <div class="overall-ring" id="pracRing">0%</div>
            </div>
        </div>

        <input type="text" class="search-box" id="searchInput" placeholder="Search modules..." onkeyup="filterSubjects()">
        <div class="section-title">Analytics</div>
        <div class="subject-list" id="subjectList"></div>
    </div>

    <!-- Sync Modal with Game Integration -->
    <div class="modal" id="syncModal">
        <div class="modal-content">
            <h3>SYSTEM SYNC</h3>
            
            <div id="authForm">
                <p style="font-size: 12px; color: #888888; margin: 0;">Enter credentials to authenticate.</p>
                <input type="text" class="modal-input" id="collegeId" placeholder="User ID">
                <input type="password" class="modal-input" id="collegePass" placeholder="Password">
                <div class="header-actions" style="justify-content: flex-end; margin-top: 5px;">
                    <button class="btn" style="background: transparent; border-color: #333;" onclick="closeSyncModal()">Cancel</button>
                    <button class="btn" id="syncBtn" onclick="runLiveSync()">Authenticate</button>
                </div>
            </div>

            <!-- Mini Game inside Modal -->
            <div class="game-container" id="gameContainer">
                <p style="font-size: 12px; color: #888888; margin-bottom: 8px;">Fetching data... Play a match! 🎮</p>
                <div class="game-status" id="gameStatus">Your Turn (X)</div>
                <div class="board" id="board">
                    <div class="cell" onclick="makeMove(0)" tabindex="0"></div>
                    <div class="cell" onclick="makeMove(1)" tabindex="0"></div>
                    <div class="cell" onclick="makeMove(2)" tabindex="0"></div>
                    <div class="cell" onclick="makeMove(3)" tabindex="0"></div>
                    <div class="cell" onclick="makeMove(4)" tabindex="0"></div>
                    <div class="cell" onclick="makeMove(5)" tabindex="0"></div>
                    <div class="cell" onclick="makeMove(6)" tabindex="0"></div>
                    <div class="cell" onclick="makeMove(7)" tabindex="0"></div>
                    <div class="cell" onclick="makeMove(8)" tabindex="0"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Subject Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3>MANUAL ENTRY</h3>
            <input type="text" class="modal-input" id="newSubName" placeholder="Module Name">
            <input type="number" class="modal-input" id="newSubPresent" placeholder="Attended">
            <input type="number" class="modal-input" id="newSubTotal" placeholder="Total">
            <div class="header-actions" style="justify-content: flex-end; margin-top: 10px;">
                <button class="btn" style="background: transparent; border-color: #333;" onclick="closeAddModal()">Cancel</button>
                <button class="btn" onclick="saveNewSubject()">Save</button>
            </div>
        </div>
    </div>

    <!-- Hidden Visitors Counter -->
    <img src="https://hits.sh/eimi-attendance.vercel.app.svg" style="opacity: 0; position: absolute; width: 1px; height: 1px; z-index: -1;">
    <div style="text-align: center; margin-top: 40px; margin-bottom: 20px; font-size: 11px; color: #525252; letter-spacing: 2px; font-weight: 600; text-transform: uppercase;">
    Built with ⚡ by Nixay Raut
    </div>

    <script>
        let currentSubjects = [];
        const API_URL = "https://attendpro-web-2.onrender.com/sync";

        // === KEYBOARD NAVIGATION LOGIC ===
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.activeElement.blur();
                closeAddModal();
                closeSyncModal();
                return;
            }

            if (e.key === 'Enter') {
                if (document.getElementById('syncModal').style.display === 'flex' && document.getElementById('authForm').style.display !== 'none') {
                    runLiveSync();
                    return;
                }
                if (document.getElementById('addModal').style.display === 'flex') {
                    saveNewSubject();
                    return;
                }
            }

            if (document.activeElement.tagName !== 'INPUT') {
                if (e.key.toLowerCase() === 's') {
                    e.preventDefault();
                    openSyncModal();
                    setTimeout(() => document.getElementById('collegeId').focus(), 100);
                }
                if (e.key.toLowerCase() === 'a') {
                    e.preventDefault();
                    openAddModal();
                    setTimeout(() => document.getElementById('newSubName').focus(), 100);
                }
                if (e.key === '/') {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
            }
        });

        // === GAME LOGIC (HARD MODE) 🔥 ===
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;

        function makeMove(idx) {
            if(boardState[idx] === "" && gameActive) {
                boardState[idx] = "X";
                updateBoardUI();
                checkWin();
                if(gameActive) setTimeout(botMove, 400);
            }
        }

        function findWinningMove(player) {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let line of lines) {
                let [a, b, c] = line;
                if(boardState[a] === player && boardState[b] === player && boardState[c] === "") return c;
                if(boardState[a] === player && boardState[c] === player && boardState[b] === "") return b;
                if(boardState[b] === player && boardState[c] === player && boardState[a] === "") return a;
            }
            return -1;
        }

        function botMove() {
            let empty = boardState.map((val, i) => val === "" ? i : null).filter(val => val !== null);
            if(empty.length === 0) return;

            let move = findWinningMove("O"); 
            if(move === -1) move = findWinningMove("X"); 
            if(move === -1 && boardState[4] === "") move = 4; 
            if(move === -1) move = empty[Math.floor(Math.random() * empty.length)]; 

            boardState[move] = "O";
            updateBoardUI();
            checkWin();
        }

        function updateBoardUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => { 
                cell.innerText = boardState[i]; 
                cell.style.color = boardState[i] === 'X' ? '#86efac' : '#fde047'; 
            });
        }

        function checkWin() {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let line of lines) {
                if(boardState[line[0]] && boardState[line[0]] === boardState[line[1]] && boardState[line[1]] === boardState[line[2]]) {
                    document.getElementById('gameStatus').innerText = boardState[line[0]] + " WINS! 🏆";
                    gameActive = false;
                    setTimeout(resetGame, 1500);
                    return;
                }
            }
            if(!boardState.includes("")) {
                document.getElementById('gameStatus').innerText = "DRAW! 🤝";
                gameActive = false;
                setTimeout(resetGame, 1500);
            }
        }

        function resetGame() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            document.getElementById('gameStatus').innerText = "Your Turn (X)";
            updateBoardUI();
        }

        // === ATTENDANCE LOGIC ===
        function calculateStatus(present, total) {
            if (total === 0) return { pct: 0, status: "Pending" };
            const pct = Math.round((present / total) * 100);
            if (pct >= 75) {
                const safeBunks = Math.floor((present - (0.75 * total)) / 0.75);
                return { pct, status: `Safe [${safeBunks} bunks left]` };
            } else {
                const needed = Math.ceil(((0.75 * total) - present) / 0.25);
                return { pct, status: `Warning [Need ${needed} classes]` };
            }
        }

        function updateOverallStats(data) {
            if (!data || data.length === 0) return;
            let tPresent = 0, tTotal = 0, tRisk = 0;
            let pPresent = 0, pTotal = 0, pRisk = 0;
            data.forEach(sub => { 
                if (sub.name.includes("(Practical)")) {
                    pPresent += sub.present; pTotal += sub.total; if (sub.pct < 75) pRisk++; 
                } else {
                    tPresent += sub.present; tTotal += sub.total; if (sub.pct < 75) tRisk++; 
                }
            });

            const tPct = tTotal === 0 ? 0 : Math.round((tPresent / tTotal) * 100);
            const tRing = document.getElementById('theoryRing');
            const tText = document.getElementById('theoryStatusText');
            tRing.innerText = tPct + '%';
            if (tPct >= 75 && tRisk === 0) {
                tText.innerHTML = 'Secure'; tText.style.color = '#86efac';
                tRing.style.color = '#86efac'; tRing.style.borderColor = '#86efac';
            } else {
                tText.innerHTML = 'At Risk'; tText.style.color = '#fde047';
                tRing.style.color = '#fde047'; tRing.style.borderColor = '#fde047';
            }

            const pPct = pTotal === 0 ? 0 : Math.round((pPresent / pTotal) * 100);
            const pRing = document.getElementById('pracRing');
            const pText = document.getElementById('pracStatusText');
            pRing.innerText = pPct + '%';
            if (pPct >= 75 && pRisk === 0) {
                pText.innerHTML = 'Secure'; pText.style.color = '#86efac';
                pRing.style.color = '#86efac'; pRing.style.borderColor = '#86efac';
            } else {
                pText.innerHTML = 'At Risk'; pText.style.color = '#fde047';
                pRing.style.color = '#fde047'; pRing.style.borderColor = '#fde047';
            }
        }

        function renderSubjects(data) {
            const listContainer = document.getElementById('subjectList');
            listContainer.innerHTML = '';
            if (!data || data.length === 0) { listContainer.innerHTML = '<p style="text-align:center; color:#525252; font-size:13px; padding:20px;">NO DATA. INITIATE SYNC.</p>'; return; }
            data.forEach((sub, index) => {
                const isRisk = sub.pct < 75;
                const statusClass = isRisk ? 'risk' : 'safe';
                listContainer.innerHTML += `
                    <div class="subject-card">
                        <div class="card-top">
                            <div class="subject-info">
                                <h4>${sub.name}</h4>
                                <div style="font-size:11px; color:#888888; margin:3px 0; font-family: monospace;">DATA: ${sub.present}/${sub.total}</div>
                                <div class="status-tag ${statusClass}">${isRisk ? '⚠' : '●'} ${sub.status}</div>
                            </div>
                            <div class="percentage" style="color: ${isRisk ? '#fde047' : '#86efac'}">${sub.pct}%</div>
                        </div>
                        <div class="quick-actions">
                            <button class="action-btn" onclick="quickMark(${index}, true)">+1 Pres</button>
                            <button class="action-btn" onclick="quickMark(${index}, false)">+1 Bunk</button>
                        </div>
                    </div>`;
            });
        }

        function quickMark(index, isPresent) {
            currentSubjects[index].total += 1;
            if (isPresent) currentSubjects[index].present += 1;
            const info = calculateStatus(currentSubjects[index].present, currentSubjects[index].total);
            currentSubjects[index].pct = info.pct; currentSubjects[index].status = info.status;
            saveAndRefresh();
        }

        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }
        function openSyncModal() { 
            document.getElementById('syncModal').style.display = 'flex'; 
            document.getElementById('authForm').style.display = 'flex';
            document.getElementById('gameContainer').style.display = 'none';
        }
        function closeSyncModal() { 
            document.getElementById('syncModal').style.display = 'none'; 
        }

        function saveNewSubject() {
            const name = document.getElementById('newSubName').value;
            const present = parseInt(document.getElementById('newSubPresent').value) || 0;
            const total = parseInt(document.getElementById('newSubTotal').value) || 0;
            if (!name || total <= 0) return alert("Invalid Input!");
            const info = calculateStatus(present, total);
            currentSubjects.push({ name, present, total, status: info.status, pct: info.pct });
            closeAddModal(); saveAndRefresh();
        }

        async function runLiveSync() {
            const user = document.getElementById('collegeId').value.trim();
            const pass = document.getElementById('collegePass').value.trim();
            if(!user || !pass) return alert("Credentials Required!");

            document.getElementById('authForm').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'block';
            resetGame();

            try {
                const res = await fetch(`${API_URL}?user=${encodeURIComponent(user)}&passw=${encodeURIComponent(pass)}`);
                const result = await res.json();
                
                if(result.success) {
                    let nameCount = {};
                    result.data.forEach(sub => { nameCount[sub.name] = (nameCount[sub.name] || 0) + 1; });

                    let currentNameCount = {};
                    currentSubjects = result.data.map(sub => {
                        let finalName = sub.name;
                        if (nameCount[sub.name] > 1) {
                            currentNameCount[sub.name] = (currentNameCount[sub.name] || 0) + 1;
                            if (currentNameCount[sub.name] === 1) finalName += " (Theory)";
                            else if (currentNameCount[sub.name] === 2) finalName += " (Practical)";
                        }
                        const info = calculateStatus(sub.present, sub.total);
                        return { ...sub, name: finalName, status: info.status };
                    });

                    saveAndRefresh();
                    closeSyncModal();
                    alert("System Synced Successfully.");
                } else {
                    alert("Auth Failed: " + result.error);
                    document.getElementById('authForm').style.display = 'flex';
                    document.getElementById('gameContainer').style.display = 'none';
                }
            } catch(e) {
                alert("Server timeout. Retrying connection in background.");
                document.getElementById('authForm').style.display = 'flex';
                document.getElementById('gameContainer').style.display = 'none';
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('user_attendance', JSON.stringify(currentSubjects));
            updateOverallStats(currentSubjects); renderSubjects(currentSubjects);
        }

        function filterSubjects() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderSubjects(currentSubjects.filter(s => s.name.toLowerCase().includes(q)));
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('user_attendance');
            if (saved) { currentSubjects = JSON.parse(saved); updateOverallStats(currentSubjects); renderSubjects(currentSubjects); }
        });
    </script>
</body>
</html>
