<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendPro 75 - Interactive Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(45deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        .header-actions { display: flex; gap: 8px; }
        .btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 8px 12px; border-radius: 12px; cursor: pointer; transition: 0.3s; font-size: 13px; font-weight: 500; }
        .btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.2); }
        .btn-add { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.3); color: #38bdf8; }
        .btn-sync { background: rgba(74, 222, 128, 0.15); border-color: rgba(74, 222, 128, 0.3); color: #4ade80; }
        .search-box { width: 100%; padding: 12px 16px; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; color: #fff; font-size: 14px; margin-bottom: 20px; outline: none; }
        .overall-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .overall-info h3 { font-size: 13px; color: #94a3b8; }
        .overall-info h2 { font-size: 18px; font-weight: 700; margin: 4px 0; }
        .overall-ring { font-size: 18px; font-weight: 700; padding: 15px; border-radius: 50%; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; border: 2px solid; }
        .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #e2e8f0; }
        .subject-list { display: flex; flex-direction: column; gap: 12px; max-height: 480px; overflow-y: auto; }
        .subject-card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .subject-info h4 { font-size: 13px; font-weight: 600; color: #f1f5f9; }
        .status-tag { font-size: 11px; font-weight: 600; }
        .safe { color: #4ade80; } .risk { color: #fbbf24; }
        .percentage { font-weight: 700; font-size: 16px; text-align: right; }
        .quick-actions { display: flex; gap: 8px; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 8px; justify-content: flex-end; }
        .action-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #cbd5e1; padding: 4px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: #1e293b; border-radius: 20px; padding: 24px; width: 90%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }
        .modal-input { padding: 10px; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #fff; outline: none; }
        .loader { font-size: 12px; color: #fbbf24; text-align: center; display: none; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>AttendPro 🚀</h1>
            <div class="header-actions">
                <button class="btn btn-add" onclick="openAddModal()">➕ Add</button>
                <button class="btn btn-sync" onclick="openSyncModal()">🔄 Live Sync</button>
            </div>
        </div>

        <div class="overall-card">
            <div class="overall-info">
                <h3>Overall Status</h3>
                <h2 id="overallStatusText">Loading...</h2>
            </div>
            <div class="overall-ring" id="overallRing">0%</div>
        </div>

        <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search subject..." onkeyup="filterSubjects()">
        <div class="section-title">All Subjects Analytics</div>
        <div class="subject-list" id="subjectList"></div>
    </div>

    <!-- Sync Credentials Modal -->
    <div class="modal" id="syncModal">
        <div class="modal-content">
            <h3 style="color: #4ade80;">Live Portal Sync 🌐</h3>
            <p style="font-size: 12px; color: #94a3b8;">Enter college portal details to fetch live attendance.</p>
            <input type="text" class="modal-input" id="collegeId" placeholder="College ID (e.g. 126nixay12006)">
            <input type="password" class="modal-input" id="collegePass" placeholder="Password">
            <div class="loader" id="syncLoader">⏳ Scraping portal... Captcha solving takes 30-40 sec. Please wait!</div>
            <div class="header-actions" style="justify-content: flex-end; margin-top: 10px;">
                <button class="btn" onclick="closeSyncModal()">Cancel</button>
                <button class="btn btn-sync" id="syncBtn" onclick="runLiveSync()">Start Sync</button>
            </div>
        </div>
    </div>

    <!-- Add Subject Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3 style="color: #38bdf8;">Add Manual Attendance</h3>
            <input type="text" class="modal-input" id="newSubName" placeholder="Subject Name">
            <input type="number" class="modal-input" id="newSubPresent" placeholder="Attended Classes">
            <input type="number" class="modal-input" id="newSubTotal" placeholder="Total Classes">
            <div class="header-actions" style="justify-content: flex-end; margin-top: 10px;">
                <button class="btn" onclick="closeAddModal()">Cancel</button>
                <button class="btn btn-add" onclick="saveNewSubject()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let currentSubjects = [];
        const API_URL = "https://attendpro-web.onrender.com/sync"; // TERA LIVE RENDER URL 🔥

        function calculateStatus(present, total) {
            if (total === 0) return { pct: 0, status: "No classes yet" };
            const pct = Math.round((present / total) * 100);
            if (pct >= 75) {
                const safeBunks = Math.floor((present - (0.75 * total)) / 0.75);
                return { pct, status: `Safe (${safeBunks} bunks left)` };
            } else {
                const needed = Math.ceil(((0.75 * total) - present) / 0.25);
                return { pct, status: `At Risk (Need ${needed} classes)` };
            }
        }

        function updateOverallStats(data) {
            if (!data || data.length === 0) return;
            let totalPresent = 0, totalClasses = 0, atRiskCount = 0;
            data.forEach(sub => { totalPresent += sub.present; totalClasses += sub.total; if (sub.pct < 75) atRiskCount++; });
            if (totalClasses === 0) return;
            const overallPct = Math.round((totalPresent / totalClasses) * 100);
            const ring = document.getElementById('overallRing');
            const statusText = document.getElementById('overallStatusText');
            ring.innerText = overallPct + '%';
            if (overallPct >= 75 && atRiskCount === 0) {
                statusText.innerHTML = 'Safe to Bunk! 🟢'; statusText.style.color = '#4ade80';
                ring.style.color = '#4ade80'; ring.style.borderColor = 'rgba(74, 222, 128, 0.3)';
            } else {
                statusText.innerHTML = 'At Risk / Low ⚠️'; statusText.style.color = '#fbbf24';
                ring.style.color = '#fbbf24'; ring.style.borderColor = 'rgba(251, 191, 36, 0.3)';
            }
        }

        function renderSubjects(data) {
            const listContainer = document.getElementById('subjectList');
            listContainer.innerHTML = '';
            if (!data || data.length === 0) { listContainer.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:13px; padding:20px;">No data. Click Live Sync!</p>'; return; }
            
            data.forEach((sub, index) => {
                const isRisk = sub.pct < 75;
                const statusClass = isRisk ? 'risk' : 'safe';
                listContainer.innerHTML += `
                    <div class="subject-card">
                        <div class="card-top">
                            <div class="subject-info">
                                <h4>${sub.name}</h4>
                                <div style="font-size:11px; color:#94a3b8; margin:3px 0;">Classes: ${sub.present}/${sub.total}</div>
                                <div class="status-tag ${statusClass}">${isRisk ? '⚠️' : '🟢'} ${sub.status}</div>
                            </div>
                            <div class="percentage" style="color: ${isRisk ? '#fbbf24' : '#4ade80'}">${sub.pct}%</div>
                        </div>
                        <div class="quick-actions">
                            <button class="action-btn" onclick="quickMark(${index}, true)">+1 Present</button>
                            <button class="action-btn" onclick="quickMark(${index}, false)">+1 Bunk</button>
                        </div>
                    </div>`;
            });
        }

        function quickMark(index, isPresent) {
            currentSubjects[index].total += 1;
            if (isPresent) currentSubjects[index].present += 1;
            const info = calculateStatus(currentSubjects[index].present, currentSubjects[index].total);
            currentSubjects[index].pct = info.pct; currentSubjects[index].status = info.status;
            saveAndRefresh();
        }

        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }
        function openSyncModal() { document.getElementById('syncModal').style.display = 'flex'; }
        function closeSyncModal() { document.getElementById('syncModal').style.display = 'none'; document.getElementById('syncLoader').style.display = 'none'; }

        function saveNewSubject() {
            const name = document.getElementById('newSubName').value;
            const present = parseInt(document.getElementById('newSubPresent').value) || 0;
            const total = parseInt(document.getElementById('newSubTotal').value) || 0;
            if (!name || total <= 0) return alert("Valid details daalo!");
            const info = calculateStatus(present, total);
            currentSubjects.push({ name, present, total, status: info.status, pct: info.pct });
            closeAddModal(); saveAndRefresh();
        }

        async function runLiveSync() {
            const user = document.getElementById('collegeId').value.trim();
            const pass = document.getElementById('collegePass').value.trim();
            if(!user || !pass) return alert("Bhai ID aur Password toh daal!");

            document.getElementById('syncBtn').disabled = true;
            document.getElementById('syncLoader').style.display = 'block';

            try {
                const res = await fetch(`${API_URL}?user=${encodeURIComponent(user)}&passw=${encodeURIComponent(pass)}`);
                const result = await res.json();
                
                if(result.success) {
                    currentSubjects = result.data.map(sub => {
                        const info = calculateStatus(sub.present, sub.total);
                        return { ...sub, status: info.status };
                    });
                    saveAndRefresh();
                    closeSyncModal();
                    alert("✨ Live attendance successfully fetched!");
                } else {
                    alert("❌ Login Error: " + result.error);
                }
            } catch(e) {
                alert("❌ Server issue. Render backend wake-up mode me hoga, 1 min baad wapas try kar!");
            }
            document.getElementById('syncBtn').disabled = false;
            document.getElementById('syncLoader').style.display = 'none';
        }

        function saveAndRefresh() {
            localStorage.setItem('user_attendance', JSON.stringify(currentSubjects));
            updateOverallStats(currentSubjects); renderSubjects(currentSubjects);
        }

        function filterSubjects() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderSubjects(currentSubjects.filter(s => s.name.toLowerCase().includes(q)));
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('user_attendance');
            if (saved) { currentSubjects = JSON.parse(saved); updateOverallStats(currentSubjects); renderSubjects(currentSubjects); }
        });
    </script>
</body>
</html>
